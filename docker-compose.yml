services: 
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: flowline
      POSTGRES_PASSWORD: flowline
      POSTGRES_DB: flowline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:7
    container_name: flowline-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: